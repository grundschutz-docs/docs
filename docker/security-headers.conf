# Sicherheits-Header. Wird im server-Block UND in jedem location-Block mit eigenem
# add_header eingebunden: nginx vererbt add_header nur, solange ein Block keinen eigenen
# hat. Ohne diese Einbindung verloeren /_astro/ und /pagefind/ die Header still.
# "always": auch bei 404 und anderen Fehlerantworten.
#
# Bewusst keine script-src-Regel: die Seiten brauchen Inline-Skripte (Theme, Banner,
# Download-Handler). Die Direktiven unten sind die, die ohne Skript-Umbau sicher sind.
# HSTS fehlt mit Absicht: das setzt der TLS-terminierende Reverse-Proxy. Wer nginx selbst
# mit TLS betreibt, ergaenzt: add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
