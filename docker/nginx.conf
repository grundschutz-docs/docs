server {
	listen 8080;
	server_name _;

	# Version nicht in Fehlerseiten und Header schreiben.
	server_tokens off;

	include snippets/security-headers.conf;
	root /usr/share/nginx/html;
	index index.html;

	# Starlight schreibt jede Seite als Verzeichnis mit eigener index.html
	# (trailingSlash-Default "ignore") -- $uri/ deckt sowohl /pfad als auch
	# /pfad/ ab, ohne eigene Rewrite-Regeln.
	location / {
		try_files $uri $uri/ =404;
	}

	# Unter /en/ die englische Fehlerseite. Astro baut sie als /en/404/index.html (nur die
	# deutsche heisst 404.html). ^~ verhindert, dass die Regex-Location fuer .csv unten
	# mitentscheidet; unter /en/ liegen keine Downloads.
	location ^~ /en/ {
		try_files $uri $uri/ =404;
		error_page 404 /en/404/index.html;
	}

	# Eigene 404-Seite (src/pages/404.astro), kein nginx-Standardfehler.
	error_page 404 /404.html;

	# _astro/ traegt vom Build gehashte Dateinamen -- die aendern sich nie
	# unter demselben Namen, der Browser darf sie dauerhaft cachen. Alles
	# andere (HTML, Pagefind-Index) nicht: ein Redeploy soll sofort sichtbar
	# sein, nicht erst nach Ablauf eines Caches.
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		include snippets/security-headers.conf;
	}

	location /pagefind/ {
		add_header Cache-Control "public, max-age=3600";
		include snippets/security-headers.conf;
	}

	# nginx kennt .csv nicht (mime.types), die Downloads unter /downloads/ gingen
	# als application/octet-stream raus -- ohne Kompression und ohne dass der
	# Browser sie als CSV erkennt. Da .csv in der Tabelle fehlt, greift hier
	# default_type; die anderen Dateien in /downloads/ (json, txt) behalten
	# ihren Typ.
	location ~ \.csv$ {
		default_type text/csv;
	}

	# Die Feeds heissen .xml, mime.types macht daraus text/xml. Reader und Validatoren erwarten
	# application/rss+xml. "types { }" leert die Typtabelle fuer diese Location, dann gilt
	# default_type (wie bei den CSV-Dateien oben). Die Sicherheits-Header kommen vom server-Block:
	# die Location hat kein eigenes add_header.
	location ~ ^/(aenderungen|befunde)/feed\.xml$ {
		types { }
		default_type application/rss+xml;
	}

	# text/html fehlt mit Absicht: nginx komprimiert es immer, ein Eintrag
	# erzeugt bei jedem Start die Warnung "duplicate MIME type".
	gzip on;
	# Stufe 1 ist nginx' Standard und die schwächste: die Katalogseiten (KONF 948 KB HTML) kamen mit
	# 141 KB an, Stufe 6 schafft 101 KB (gemessen mit zlib, PageSpeed sah 142 KiB). Die Seiten sind
	# statisch und klein genug, dass die Rechenzeit keine Rolle spielt; Stufe 9 spart nur noch 0,6 KB mehr.
	gzip_comp_level 6;
	# Vary: Accept-Encoding, damit ein Zwischenspeicher komprimierte und unkomprimierte Antworten nicht verwechselt.
	gzip_vary on;
	gzip_types text/css application/javascript application/json application/wasm text/csv text/xml application/rss+xml image/svg+xml;
}
