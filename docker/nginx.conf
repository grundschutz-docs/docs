# Kurzlinks: grundschutz-docs.de/GC.5.1.1 fuehrt zur Anforderung (Seite der Praktik, Anker = ID).
# Eine Regel je Praktik, weil nginx den Seitennamen nicht kleinschreiben kann; unbekannte Praefixe
# ("/XYZ.1.1") bleiben 404, statt auf eine Seite zu zeigen, die es nicht gibt. Gross-/Kleinschreibung
# wie im Katalog (IDs sind gross). Ein Test (test_nginx.py) vergleicht die Liste mit den Praktiken
# im Katalog: kommt beim BSI eine Praktik dazu, wird er rot.
map $uri $kurzlink_seite {
	default "";
	~^/GC\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/gc/;
	~^/STM\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/stm/;
	~^/UMS\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/ums/;
	~^/VRB\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/vrb/;
	~^/PERF\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/perf/;
	~^/RISK\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/risk/;
	~^/ASST\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/asst/;
	~^/PERS\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/pers/;
	~^/BES\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/bes/;
	~^/DLS\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/dls/;
	~^/TEST\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/test/;
	~^/GEB\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/geb/;
	~^/SENS\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/sens/;
	~^/ARCH\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/arch/;
	~^/BER\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/ber/;
	~^/NOT\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/not/;
	~^/DET\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/det/;
	~^/REA\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/rea/;
	~^/KONF\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/konf/;
	~^/DEV\.[0-9]+(\.[0-9]+)*/?$ /grundschutzpp/dev/;
}

server {
	listen 8080;
	server_name _;

	# Version nicht in Fehlerseiten und Header schreiben.
	server_tokens off;

	# Weiterleitungen relativ senden ("Location: /en/"), nicht als absolute Adresse. Hinter dem Proxy
	# kennt nginx weder https noch den öffentlichen Port: absolut baute es "http://host:8080/en/", seit
	# der Container auf 8080 lauscht (vorher Port 80, den eine Adresse weglässt), und das ist von außen
	# nicht erreichbar. Betraf jede Adresse ohne Schrägstrich am Ende, auch das Logo auf den
	# englischen Seiten (href="/en").
	absolute_redirect off;

	include snippets/security-headers.conf;
	root /usr/share/nginx/html;
	index index.html;

	# Kurzlink auf eine Anforderung. 302 statt 301: Die Weiterleitung soll sich aendern duerfen, falls
	# das BSI Anforderungen verschiebt. Der Anker nach dem # bleibt im Browser (kommt nicht zum Server).
	location ~ "^/(?<kurzlink_id>[A-Z]+(\.[0-9]+)+)/?$" {
		if ($kurzlink_seite = "") {
			return 404;
		}
		return 302 "${kurzlink_seite}#${kurzlink_id}";
	}

	# Starlight schreibt jede Seite als Verzeichnis mit eigener index.html
	# (trailingSlash-Default "ignore") -- $uri/ deckt sowohl /pfad als auch
	# /pfad/ ab, ohne eigene Rewrite-Regeln.
	location / {
		try_files $uri $uri/ =404;
	}

	# Unter /en/ die englische Fehlerseite. Astro baut sie als /en/404/index.html (nur die
	# deutsche heisst 404.html). ^~ verhindert, dass die Regex-Location fuer .csv unten
	# mitentscheidet; unter /en/ liegen keine Downloads.
	location ^~ /en/ {
		try_files $uri $uri/ =404;
		error_page 404 /en/404/index.html;
	}

	# Eigene 404-Seite (src/pages/404.astro), kein nginx-Standardfehler.
	error_page 404 /404.html;

	# _astro/ traegt vom Build gehashte Dateinamen -- die aendern sich nie
	# unter demselben Namen, der Browser darf sie dauerhaft cachen. Alles
	# andere (HTML, Pagefind-Index) nicht: ein Redeploy soll sofort sichtbar
	# sein, nicht erst nach Ablauf eines Caches.
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		include snippets/security-headers.conf;
	}

	# Pagefind: index/, fragment/ und filter/ tragen einen Hash im Dateinamen (de_3b60196.pf_index) und
	# dürfen lange im Cache bleiben. Der Rest (pagefind-entry.json, die Skripte) hat feste Namen:
	# no-cache heisst "vor jeder Nutzung nachfragen" (304, wenn unveraendert). Mit max-age=3600 konnte ein
	# Browser nach einem Deploy den alten Einstieg mit neuen Seiten mischen.
	location ~ ^/pagefind/(index|fragment|filter)/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		include snippets/security-headers.conf;
	}

	location /pagefind/ {
		add_header Cache-Control "no-cache";
		include snippets/security-headers.conf;
	}

	# Downloads (JSON, Excel, LIZENZ.txt) und die Aenderungsdaten des ID-Checks haben feste Namen und aendern
	# sich mit jedem Katalogstand: nachfragen statt auf eine Heuristik des Browsers zu vertrauen.
	location /downloads/ {
		add_header Cache-Control "no-cache";
		include snippets/security-headers.conf;
	}

	location = /aenderungen/ids.json {
		add_header Cache-Control "no-cache";
		include snippets/security-headers.conf;
	}

	# nginx kennt .csv nicht (mime.types), die Downloads unter /downloads/ gingen
	# als application/octet-stream raus -- ohne Kompression und ohne dass der
	# Browser sie als CSV erkennt. Da .csv in der Tabelle fehlt, greift hier
	# default_type; die anderen Dateien in /downloads/ (json, txt) behalten
	# ihren Typ.
	location ~ \.csv$ {
		default_type text/csv;
		add_header Cache-Control "no-cache";
		include snippets/security-headers.conf;
	}

	# Die Feeds heissen .xml, mime.types macht daraus text/xml. Reader und Validatoren erwarten
	# application/rss+xml. "types { }" leert die Typtabelle fuer diese Location, dann gilt
	# default_type (wie bei den CSV-Dateien oben). Die Sicherheits-Header kommen vom server-Block:
	# die Location hat kein eigenes add_header.
	location ~ ^/(aenderungen|befunde)/feed\.xml$ {
		types { }
		default_type application/rss+xml;
	}

	# text/html fehlt mit Absicht: nginx komprimiert es immer, ein Eintrag
	# erzeugt bei jedem Start die Warnung "duplicate MIME type".
	gzip on;
	# Stufe 1 ist nginx' Standard und die schwächste: die Katalogseiten (KONF 948 KB HTML) kamen mit
	# 141 KB an, Stufe 6 schafft 101 KB (gemessen mit zlib, PageSpeed sah 142 KiB). Die Seiten sind
	# statisch und klein genug, dass die Rechenzeit keine Rolle spielt; Stufe 9 spart nur noch 0,6 KB mehr.
	gzip_comp_level 6;
	# Vary: Accept-Encoding, damit ein Zwischenspeicher komprimierte und unkomprimierte Antworten nicht verwechselt.
	gzip_vary on;
	gzip_types text/css application/javascript application/json application/wasm text/csv text/xml application/rss+xml image/svg+xml;
}
