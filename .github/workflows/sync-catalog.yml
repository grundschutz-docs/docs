name: Sync upstream catalog

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC — adjust once the pilot phase settles down
  workflow_dispatch:

# A manual run landing on top of the daily cron would otherwise push the
# same branch from two directions at once.
concurrency:
  group: sync-catalog

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout upstream BSI catalog
        uses: actions/checkout@v4
        with:
          repository: BSI-Bund/Stand-der-Technik-Bibliothek
          sparse-checkout: |
            control_layer/Grundschutz++
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate docs from the upstream catalog
        env:
          GRUNDSCHUTZPP_CATALOG: upstream/control_layer/Grundschutz++/Grundschutz++-resolved_catalog.json
        run: python3 scripts/generate_docs.py

      - name: Open a PR if anything changed
        # Pinned to a commit, not the v7 tag: this step runs with
        # contents/pull-requests write access, the one place in either
        # workflow where a retagged or compromised release could do real
        # damage. Trailing version comment is Dependabot's convention for
        # tracking pinned Action SHAs — it bumps both together.
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          commit-message: 'Sync generated docs with upstream Grundschutz++ catalog'
          title: 'Sync: upstream Grundschutz++ catalog changed'
          body: |
            The BSI's `Grundschutz++-resolved_catalog.json` changed upstream.
            This PR regenerates the docs from the new version.

            Review the diff before merging — read it, don't just trust that CI
            passed (see CONTRIBUTING.md, "Green isn't the same as right").
          branch: sync/upstream-catalog
          add-paths: src/content/docs/grundschutzpp/**
