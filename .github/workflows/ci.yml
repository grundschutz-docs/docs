name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only builds, it never needs to write back to the
# repo or to a PR. Explicit so a future org-wide default change can't
# silently widen it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
