name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only builds, it never needs to write back to the
# repo or to a PR. Explicit so a future org-wide default change can't
# silently widen it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Tests in scripts/tests/ that need the built site or a tool the build
      # does not use. Each one fails loudly when its prerequisite is missing
      # instead of skipping, so a runner change cannot turn them into no-ops.
      - name: Tests on the built site
        run: |
          python3 -B scripts/tests/test_pagefind_en.py
          python3 -B scripts/tests/test_en_links.py
          python3 -B scripts/tests/test_markup.py
          python3 -B scripts/tests/test_zielobjekte_hinweis.py
          python3 -B scripts/tests/test_befunde.py
          python3 -B scripts/tests/test_methodik_struktur.py
          python3 -B scripts/tests/test_isb_reihenfolge.py
          python3 -B scripts/tests/test_timeline.py
          python3 -B scripts/tests/test_feed.py
          python3 -B scripts/tests/test_id_check.py
          python3 -B scripts/tests/test_festlegungen.py
          python3 -B scripts/tests/test_zusammenhang.py
          python3 -B scripts/tests/test_gefaehrdungen_seiten.py
          python3 -B scripts/tests/test_lizenzzeile.py
          python3 -B scripts/tests/test_hreflang.py
          python3 -B scripts/tests/test_upstream_pfade.py

      # These read src/lib/*.ts directly; Node 22 needs the flag to strip the types.
      - name: TypeScript library tests (ID check, export query and checklist)
        run: node --experimental-strip-types --test scripts/tests/id-check.test.mjs scripts/tests/export-libs.test.mjs scripts/tests/datum.test.mjs

      # exceljs is the foreign reader that compare.py checks the workbook with
      # (see scripts/xlsx/verify.py). Pinned, outside package.json and the lockfile.
      - name: Excel export filters (build-sample and compare)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/oracle" exceljs@4.4.0
          XLSX_ORACLE_DIR="$RUNNER_TEMP/oracle" python3 -B scripts/tests/test_xlsx_filter.py

      - name: nginx config test
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-light
          python3 -B scripts/tests/test_nginx.py

      # Playwright and axe-core are pinned and kept out of package.json and the
      # lockfile, the same way the Lighthouse workflow handles its tool.
      - name: Browser tests (touch tooltip, accessibility, print, theme toggle)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0 axe-core@4.10.3
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/tests/touch-tooltip.test.cjs dist
          node scripts/tests/a11y.test.cjs dist
          node scripts/tests/print.test.cjs dist
          node scripts/tests/theme-toggle.test.cjs dist

  # A broken Dockerfile or a missing tool in the image would otherwise show up only at
  # deployment. Builds the image, starts it with the hardening flags the compose file uses
  # and runs the HEALTHCHECK command itself, so a missing wget fails here too.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t grundschutz-docs:ci .

      - name: Start it and check what the image promises
        run: |
          docker run -d --name gd --cap-drop ALL --security-opt no-new-privileges:true -p 8080:8080 grundschutz-docs:ci
          for i in $(seq 1 30); do
            docker exec gd wget -q --spider http://127.0.0.1:8080/ && break
            sleep 1
          done
          # Exactly the HEALTHCHECK command from the Dockerfile.
          docker exec gd wget -q --spider http://127.0.0.1:8080/ || { docker logs gd; exit 1; }
          # Not root, and the security headers are on the page.
          test "$(docker exec gd id -u)" = "101"
          curl -fsSI http://localhost:8080/ | grep -i '^content-security-policy'
          curl -fsSI http://localhost:8080/ | grep -i '^x-content-type-options'
