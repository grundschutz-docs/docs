name: Generated files

# Answers one question: do the generated pages in this repo still equal what the
# generator produces from the BSI data they were made from? A hand edit of a
# generated .mdx, a generator change nobody re-ran, or an overwritten
# src/data/upstream.json all fail here, in the PR, instead of being overwritten
# silently by the next daily sync.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The generator writes src/data/upstream.json: the newest BSI commit that
      # changed one of its six input files. That is the state to rebuild from.
      - name: Read the pinned BSI commit
        id: pin
        run: |
          commit=$(jq -r '.commit' src/data/upstream.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "src/data/upstream.json has no valid commit: '$commit'"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Rebuilding from BSI commit $commit"

      - name: Checkout the BSI repository at that commit
        uses: actions/checkout@v7
        with:
          repository: BSI-Bund/Stand-der-Technik-Bibliothek
          ref: ${{ steps.pin.outputs.commit }}
          # Same paths and full history as the sync workflow: the changelog
          # is built from the history of the catalog file.
          sparse-checkout: |
            control_layer/Grundschutz++
            control_layer/Mappings
            documentation/namespaces
          fetch-depth: 0
          path: upstream

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Regenerate
        env:
          GRUNDSCHUTZPP_CATALOG: upstream/control_layer/Grundschutz++/Grundschutz++-resolved_catalog.json
          GRUNDSCHUTZPP_BASETHREATS: upstream/documentation/namespaces/basethreats.csv
          GRUNDSCHUTZPP_MAPPING: upstream/control_layer/Mappings/IT-GS2023-zu-GSpp/ITGS-to-GS++-mapping_collection.json
          GRUNDSCHUTZPP_TAGS: upstream/documentation/namespaces/tags.csv
          GRUNDSCHUTZPP_TARGETS: upstream/documentation/namespaces/target_object_categories.csv
          GRUNDSCHUTZPP_DOCUMENTATION: upstream/documentation/namespaces/documentation_guidelines.csv
        run: python3 scripts/generate_docs.py

      # git status, not only git diff: a file the generator creates but nobody
      # committed is an untracked file, which diff does not see. The upstream
      # checkout is a nested repository and is excluded.
      - name: Compare with what is committed
        run: |
          changes=$(git status --porcelain -- . ':!upstream')
          if [ -n "$changes" ]; then
            echo "The generator output differs from the committed files:"
            echo "$changes"
            echo
            git --no-pager diff --stat -- . ':!upstream' | tail -n 20
            echo
            echo "Run scripts/generate_docs.py against BSI commit ${{ steps.pin.outputs.commit }}"
            echo "(see README, 'How the docs are generated') and commit the result,"
            echo "or, for a generator change, regenerate and commit the generated files."
            exit 1
          fi
          echo "Generated files equal the generator output."
