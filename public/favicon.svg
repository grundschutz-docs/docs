<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<!-- Drei eingerückte Ebenen: die Katalog-Hierarchie (DET → DET.3 → DET.3.1)
	     als Form. Bewusst flach und einfarbig statt isometrisch wie der
	     Org-Avatar — bei 16 px im Browser-Tab überlebt nur die Silhouette. -->
	<g class="mark">
		<rect x="17" y="25" width="66" height="13" rx="6.5" />
		<rect x="31" y="43.5" width="52" height="13" rx="6.5" />
		<rect x="45" y="62" width="38" height="13" rx="6.5" />
	</g>
	<style>
		.mark rect { fill: #B97600; }
		@media (prefers-color-scheme: dark) {
			.mark rect { fill: #DE9C31; }
		}
	</style>
</svg>
