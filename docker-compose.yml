# Generische Self-Hoster-Vorlage -- kein Reverse-Proxy vorausgesetzt. Danach
# erreichbar unter http://localhost:8080. Wer einen eigenen Reverse-Proxy
# (Traefik, Caddy, nginx) davor betreibt, passt den "ports"-Block durch
# eigene Labels/Konfiguration an, statt diese Datei direkt zu aendern.
services:
  grundschutz-docs:
    build: .
    container_name: grundschutz-docs
    restart: unless-stopped
    ports:
      - "8080:8080"
    # nginx-unprivileged binds port 8080 as an ordinary user and needs no Linux capability.
    # Tested in CI (see the docker job in .github/workflows/ci.yml).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
